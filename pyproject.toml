[tool.poetry]
name = "risubot"
version = "0.1.0"
description = "Discord music bot"
authors = ["Risu"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
"discord.py" = {version = "^2.4.0", extras = ["voice"]}
yt-dlp = "*"
PyNaCl = "^1.5.0"
freeflow-llm = "*"
matplotlib = "^3.8"
spotipy = "*"
chromadb = "^1.0"
sentence-transformers = {version = ">=3.0", optional = true}  # local profiler (pulls in PyTorch)

[tool.poetry.extras]
local-profiler = ["sentence-transformers"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"